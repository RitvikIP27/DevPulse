# Local development stack: Postgres + FastAPI backend + React frontend.
# Usage:
#   1. cp backend/.env.example backend/.env   (fill in GITHUB_TOKEN + GITHUB_REPOS)
#   2. docker compose up --build
#   3. Backend:  http://localhost:8000/docs
#      Frontend: http://localhost:5173

version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: devpulse
      POSTGRES_PASSWORD: devpulse
      POSTGRES_DB: devpulse
    ports:
      - "5432:5432"
    volumes:
      - devpulse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devpulse"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://devpulse:devpulse@db:5432/devpulse
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  devpulse_pgdata:
