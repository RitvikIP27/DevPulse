name: DevPulse CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: devpulse
          POSTGRES_PASSWORD: devpulse
          POSTGRES_DB: devpulse
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://devpulse:devpulse@localhost:5432/devpulse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Unit and API tests
        working-directory: backend
        run: python -m pytest
      - name: Migrations apply to an empty database
        working-directory: backend
        run: alembic upgrade head
      - name: Migrations are reversible
        working-directory: backend
        run: alembic downgrade base
      - name: Models and migrations agree (no un-migrated model drift)
        working-directory: backend
        run: |
          alembic upgrade head
          # autogenerate against an up-to-date database must produce an empty
          # migration; anything else means a model changed without a migration.
          alembic revision --autogenerate -m drift_check --rev-id drift_check
          if grep -Eq '^\s+op\.(create|drop|alter|add)_' alembic/versions/drift_check_*.py; then
            echo "::error::Models have drifted from migrations. Generated operations:"
            grep -E '^\s+op\.' alembic/versions/drift_check_*.py
            exit 1
          fi
          echo "No drift between models and migrations."

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Type-check
        working-directory: frontend
        run: npx tsc -b
      - name: Unit and component tests
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t devpulse-backend:ci ./backend
      - name: Build frontend image
        run: docker build -t devpulse-frontend:ci ./frontend
