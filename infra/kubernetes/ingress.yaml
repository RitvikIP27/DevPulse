apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devpulse-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: devpulse.example.com   # replace with your domain, or use the LoadBalancer IP directly
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: devpulse-backend
                port: { number: 8000 }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: devpulse-frontend
                port: { number: 80 }
